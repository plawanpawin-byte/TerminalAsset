name: TerminalAsset
options:
  bundleIdPrefix: com.terminalasset
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  TerminalAsset:
    path: .
targets:
  TerminalAsset:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: TerminalAsset
        product: TerminalAssetCore
      - package: TerminalAsset
        product: TerminalAssetDomain
      - target: ShareExtension
      - target: WidgetExtension
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TerminalAsset
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations:
          - en
          - th
        CFBundleURLTypes:
          - CFBundleURLName: com.terminalasset.app
            CFBundleURLSchemes:
              - terminalasset
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCalendarsFullAccessUsageDescription: TerminalAsset reads your calendar on this device to show the context you need for each event, and adds events to it when you create them. Your calendar data is never uploaded.
        NSLocationWhenInUseUsageDescription: TerminalAsset uses your approximate location to show the weather for where you are. Only a coordinate rounded to about 1 km is sent, to Apple to find the city name and to the weather service for the forecast.
    entitlements:
      path: Config/TerminalAsset.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.terminalasset.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.terminalasset.app
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
    dependencies:
      - package: TerminalAsset
        product: TerminalAssetDomain
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: TerminalAsset
        CFBundleLocalizations:
          - en
          - th
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
    entitlements:
      path: Config/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.terminalasset.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.terminalasset.app.share
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  WidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - WidgetExtension
    dependencies:
      - package: TerminalAsset
        product: TerminalAssetDomain
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: TerminalAsset
        CFBundleLocalizations:
          - en
          - th
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/WidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.terminalasset.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.terminalasset.app.widget
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
