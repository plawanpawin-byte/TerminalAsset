name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test on macOS + iOS Simulator
        run: bash scripts/verify-on-mac.sh

  app-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app for iOS Simulator
        run: |
          xcodebuild build \
            -project TerminalAsset.xcodeproj \
            -scheme TerminalAsset \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Capture screenshots
        run: bash scripts/capture-screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
